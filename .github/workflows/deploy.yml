# Ships main once CI has passed on it: the EC2 stack over SSM, the two Next.js sites
# included. Nothing runs when the merge touched none of it; a manual run deploys all.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never two deploys racing on the one box; a newer merge waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  changes:
    # workflow_run fires for CI on pull requests and the merge queue too; only a
    # successful run on a push to main is a deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      portfolio: ${{ steps.diff.outputs.portfolio }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            printf 'backend=true\nfrontend=true\nportfolio=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main only takes squash merges, so the merge is exactly one commit.
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "$changed"
          touched() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
          shared='^(packages/ui/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json)'
          {
            echo "backend=$(touched '^(backend/|agent/|deploy/|integrations\.yaml|dev/runner/|portfolio/content/sources/)')"
            echo "frontend=$(touched "^frontend/|$shared")"
            echo "portfolio=$(touched "^portfolio/|$shared")"
          } >> "$GITHUB_OUTPUT"

  server:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.portfolio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: instance
        run: |
          read -r id ip < <(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=nandex-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].[InstanceId,PublicIpAddress]' --output text)
          [ "$id" != None ] || { echo "no running nandex-app instance" >&2; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
      - name: Pull and rebuild over SSM
        run: |
          # The exact commit CI passed, not whatever main is by the time this runs.
          params=$(jq -nc --arg sha "$SHA" '{commands: [
            "set -euo pipefail",
            "cd /opt/nandex/app",
            "git fetch --depth 1 origin \($sha)",
            "git reset --hard FETCH_HEAD",
            # One image at a time: two Next.js builds beside the Python images, in
            # parallel, would crowd the runner and the database out of memory.
            "export COMPOSE_PARALLEL_LIMIT=1",
            "docker compose -f deploy/docker-compose.prod.yml --env-file /opt/nandex/.env up -d --build --remove-orphans",
            # A changed Caddyfile is a bind mount, so up leaves the running Caddy on the old one.
            "docker compose -f deploy/docker-compose.prod.yml --env-file /opt/nandex/.env exec -T caddy caddy reload --config /etc/caddy/Caddyfile",
            "for s in frontend portfolio; do for i in $(seq 1 30); do docker compose -f deploy/docker-compose.prod.yml --env-file /opt/nandex/.env exec -T $s wget -qO /dev/null http://127.0.0.1:3000/ && break; [ $i = 30 ] && { echo \"$s never answered\"; exit 1; }; sleep 2; done; done",
            "docker image prune -f"
          ]}')
          cmd=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:7}" \
            --timeout-seconds 2400 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "command $cmd"
          # The aws waiter gives up after ~8 minutes; an image rebuild can take longer.
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$cmd" \
              --instance-id "${{ steps.instance.outputs.id }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 20
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "${{ steps.instance.outputs.id }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -60
          [ "$status" = Success ] || { echo "deploy finished as $status" >&2; exit 1; }
      - name: Wait for the API
        run: |
          url="https://${{ steps.instance.outputs.ip }}.nip.io/health"
          for _ in $(seq 1 30); do
            curl -fsS "$url" && exit 0
            sleep 10
          done
          echo "$url never answered" >&2
          exit 1

