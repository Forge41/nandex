name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/validate_agent_assets.py
      - run: uv run python scripts/gen_agent_permissions.py --check

  django-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's own image, not plain postgres:16 -- apps.ingest's migration runs
        # CREATE EXTENSION vector, which the official postgres image doesn't bundle.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragdb
          POSTGRES_PASSWORD: ragdb
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ragdb
      DB_USER: ragdb
      DB_PASSWORD: ragdb
      DJANGO_SECRET_KEY: ci-only-key
      INGEST_FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          # apps.retrieval's reranker shares this same directory (see rerank.py) rather than
          # needing its own cache key, so this one step covers both models.
          path: ${{ env.INGEST_FASTEMBED_CACHE_DIR }}
          key: fastembed-BAAI-bge-small-en-v1.5-Xenova-ms-marco-MiniLM-L-6-v2
      - run: uv sync --all-groups
        working-directory: backend
      - run: uv run manage.py check
        working-directory: backend
      - run: uv run manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: uv run manage.py check_integrations
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    env:
      # next build reads this at build time (see next.config.ts); it doesn't need a live
      # backend to reach, just to be present.
      BACKEND_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec tsc --noEmit
        working-directory: frontend
      - run: pnpm exec eslint
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
