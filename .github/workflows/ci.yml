name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/validate_agent_assets.py
      - run: uv run python scripts/gen_agent_permissions.py --check

  django-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ragdb
          POSTGRES_PASSWORD: ragdb
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ragdb
      DB_USER: ragdb
      DB_PASSWORD: ragdb
      DJANGO_SECRET_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
        working-directory: backend
      - run: uv run manage.py check
        working-directory: backend
      - run: uv run manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: uv run manage.py check_integrations
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
