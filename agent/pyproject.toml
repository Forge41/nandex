[project]
name = "interviewer-agent"
version = "0.1.0"
description = "The LiveKit agent that joins an interview room and talks to the candidate"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[anthropic,cartesia,deepgram,silero,turn-detector]>=1.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interviewer"]
