# The frontend is a sub-directory of this repo, so base has to be set or Netlify
# builds the repository root and finds no package.json.
[build]
  base = "frontend"
  command = "pnpm build"
  publish = "frontend/.next"

# Next.js on Netlify needs this to serve anything that is not a static file --
# server components, the route handlers, and the streaming the plan screen depends on.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11"
